name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential nasm grub-pc-bin grub-common xorriso qemu-system-x86
    
    - name: Build kernel
      run: |
        make clean
        make
    
    - name: Build with tests
      run: |
        make clean
        make CFLAGS="-DRUN_TESTS -g -O0"
    
    - name: Generate documentation
      run: |
        sudo apt-get install -y doxygen graphviz
        make docs
    
    - name: Check for errors
      run: |
        make clean
        make 2>&1 | grep -i error && exit 1 || exit 0

  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential nasm grub-pc-bin xorriso qemu-system-x86
    
    - name: Run tests
      run: |
        make clean
        make CFLAGS="-DRUN_TESTS"
        timeout 30 qemu-system-x86_64 -cdrom build/kernel.iso -m 512M -serial stdio -nographic || true
